version: "3.8"

services:
  # PostgreSQL Database
  database:
    image: postgres:14-alpine
    container_name: credit-jambo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: savings_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - credit-jambo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./savings-backend
      dockerfile: Dockerfile
    container_name: credit-jambo-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: savings_db
      JWT_SECRET: ${JWT_SECRET:-your-production-secret-key-change-this}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000,http://localhost:19006,http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - credit-jambo-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Admin Frontend
  admin:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: credit-jambo-admin
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - credit-jambo-network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Mobile App (Web version)
  mobile-web:
    build:
      context: ./client-mobile
      dockerfile: Dockerfile
    container_name: credit-jambo-mobile-web
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - credit-jambo-network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  credit-jambo-network:
    driver: bridge
