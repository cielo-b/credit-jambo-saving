<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
    <!-- Gradient Definitions -->
    <defs>
        <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
        </filter>
    </defs>

    <!-- Main Circle Background -->
    <circle cx="100" cy="100" r="95" fill="url(#primaryGradient)" filter="url(#shadow)"/>

    <!-- Coin Stack Symbol (representing credit/savings) -->
    <g transform="translate(100, 85)">
        <!-- Bottom coin -->
        <ellipse cx="0" cy="15" rx="35" ry="8" fill="#fbbf24" opacity="0.6"/>
        <!-- Middle coin -->
        <ellipse cx="0" cy="5" rx="35" ry="8" fill="#fbbf24" opacity="0.8"/>
        <!-- Top coin -->
        <ellipse cx="0" cy="-5" rx="35" ry="8" fill="url(#accentGradient)"/>

        <!-- Currency symbol on top coin -->
        <text x="0" y="2" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">$</text>
    </g>

    <!-- Welcoming Hand/Wave Element -->
    <path d="M 145 120 Q 150 115, 155 120 Q 160 125, 165 120 Q 168 117, 170 122" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>

    <!-- Jambo Accent - Rising Arrow (growth) -->
    <path d="M 75 130 L 85 120 L 95 125 L 105 115" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <polygon points="105,115 100,118 102,122" fill="#fbbf24" opacity="0.8"/>

    <!-- Inner Ring for depth -->
    <circle cx="100" cy="100" r="88" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
</svg>
